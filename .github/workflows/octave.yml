name: Octave tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GNU Octave
        run: |
          sudo apt-get update
          sudo apt-get install --yes octave

      - name: Run regression tests
        run: octave --no-gui --quiet --eval "addpath('src'); addpath('tests'); run_tests;"
